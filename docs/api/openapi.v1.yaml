openapi: 3.1.0
info:
  title: Luqa Mobile API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Stable native-client contract for Luqa. Authentication uses revocable
    opaque bearer tokens; the browser companion retains its Auth.js session.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Native device-session creation, rotation, and revocation.
  - name: Categories
    description: User-owned activity categories and identity colors.
  - name: Time entries
    description: Retrospective blocks and running activity timers.
  - name: Sleep
    description: Read-only sleep sessions already ingested through health sync.
  - name: Health
    description: >-
      On-device health ingestion. The client reads the platform store (Android
      Health Connect, iOS HealthKit later) and pushes normalized records; the
      server never pulls from a provider.
paths:
  /auth/session:
    post:
      operationId: createMobileSession
      tags: [Authentication]
      summary: Exchange owner credentials for a device session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Device session created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: revokeMobileSession
      tags: [Authentication]
      summary: Revoke the current device session
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      operationId: refreshMobileSession
      tags: [Authentication]
      summary: Rotate a refresh token and issue a new credential pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      summary: List the current user's categories
      responses:
        "200":
          description: Category collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create or resolve a category by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "200":
          description: An existing case-insensitive name match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [Time entries]
      summary: List entries overlapping a half-open UTC window
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Time-entry collection ordered by start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTimeEntry
      tags: [Time entries]
      summary: Create a completed block or running timer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntryRequest"
      responses:
        "201":
          description: Time entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /time-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTimeEntry
      tags: [Time entries]
      summary: Edit an entry, or stop a running timer by giving it an end
      description: >-
        Every field is optional; omitted fields are left untouched. Sending
        `endTime: null` reopens the entry as a running timer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeEntryRequest"
      responses:
        "200":
          description: Time entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTimeEntry
      tags: [Time entries]
      summary: Soft-delete an entry
      responses:
        "204":
          description: Time entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sleep-entries:
    get:
      operationId: listSleepEntries
      tags: [Sleep]
      summary: List sleep sessions that ended inside a half-open UTC window
      description: >-
        Sessions are attributed to the day they woke up in, which is how the
        timeline places them. Writes go through `/health/sync`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sleep-session collection ordered by wake time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepEntryListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/sync:
    get:
      operationId: getHealthSyncState
      tags: [Health]
      summary: Read what the server last accepted, per source and metric
      responses:
        "200":
          description: Sync watermarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSyncStateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: pushHealthSync
      tags: [Health]
      summary: Push sleep sessions and samples read from the device
      description: >-
        Idempotent by provider record id. Supply `sleep.window` only when the
        device re-read a full range: it authorizes the server to soft-delete
        sessions inside that range it no longer sees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthSyncRequest"
      responses:
        "200":
          description: Counts applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSyncResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived Luqa mobile access token.
  responses:
    InvalidInput:
      description: Malformed JSON, input, or query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, revoked, or missing device credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist, or is not owned by this user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many credential attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        deviceId:
          type: string
          minLength: 8
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
    MobileUser:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
    SessionCredentials:
      type: object
      additionalProperties: false
      required:
        - user
        - accessToken
        - accessExpiresAt
        - refreshToken
        - refreshExpiresAt
      properties:
        user:
          $ref: "#/components/schemas/MobileUser"
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    Category:
      type: object
      additionalProperties: false
      required: [id, name, color, archived]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        archived:
          type: boolean
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    CategoryResponse:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    EntrySource:
      type: string
      enum: [APP, GOOGLE]
    TimeEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - description
        - categoryId
        - startTime
        - endTime
        - source
      properties:
        id:
          type: string
        description:
          type: string
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        source:
          $ref: "#/components/schemas/EntrySource"
    CreateTimeEntryRequest:
      type: object
      additionalProperties: false
      required: [startTime]
      properties:
        description:
          type: string
          maxLength: 500
          default: ""
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
    TimeEntryResponse:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/TimeEntry"
    TimeEntryListResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimeEntry"
    UpdateTimeEntryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 500
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
    SleepSource:
      type: string
      enum: [HEALTH_CONNECT, APPLE_HEALTH, GOOGLE_HEALTH, MANUAL]
    SleepEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - title
        - sourceApp
        - startTime
        - endTime
        - sleepMinutes
        - awakeMinutes
        - lightMinutes
        - deepMinutes
        - remMinutes
        - isNap
      properties:
        id:
          type: string
        source:
          $ref: "#/components/schemas/SleepSource"
        title:
          type: [string, "null"]
        sourceApp:
          type: [string, "null"]
          description: Provider application that recorded the session, when known.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        sleepMinutes:
          type: [integer, "null"]
          description: Asleep minutes. Null when the provider only reported time in bed.
        awakeMinutes:
          type: [integer, "null"]
        lightMinutes:
          type: [integer, "null"]
        deepMinutes:
          type: [integer, "null"]
        remMinutes:
          type: [integer, "null"]
        efficiencyPercent:
          type: [number, "null"]
        isNap:
          type: boolean
    SleepEntryListResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SleepEntry"
    DeviceHealthSource:
      type: string
      description: Platform store the device read. Server-pull sources are not accepted here.
      enum: [HEALTH_CONNECT, APPLE_HEALTH]
    HealthMetricType:
      type: string
      enum:
        - STEPS
        - DISTANCE_METERS
        - ACTIVE_ENERGY_KCAL
        - TOTAL_ENERGY_KCAL
        - EXERCISE_MINUTES
        - HEART_RATE_BPM
        - RESTING_HEART_RATE_BPM
        - HEART_RATE_VARIABILITY_MS
        - RESPIRATORY_RATE_BPM
        - BLOOD_OXYGEN_PERCENT
        - BODY_TEMPERATURE_C
        - WEIGHT_KG
        - BODY_FAT_PERCENT
        - VO2_MAX
    SleepStage:
      type: object
      additionalProperties: false
      required: [stage, startTime, endTime]
      properties:
        stage:
          type: string
          description: Provider stage name, normalized server-side (e.g. DEEP, REM, AWAKE_IN_BED).
          maxLength: 40
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    SleepSessionImport:
      type: object
      additionalProperties: false
      required: [startTime, endTime]
      description: >-
        One provider sleep session. Stage totals and quality metrics are optional;
        anything derivable from `stages` is recomputed server-side.
      properties:
        externalId:
          type: string
          description: Provider record id. Falls back to a start/end key when absent.
          minLength: 1
          maxLength: 300
        title:
          type: [string, "null"]
          maxLength: 120
        notes:
          type: [string, "null"]
          maxLength: 2000
        sourceApp:
          type: [string, "null"]
          maxLength: 120
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        startZoneOffset:
          type: [string, "null"]
          maxLength: 40
        endZoneOffset:
          type: [string, "null"]
          maxLength: 40
        sleepMinutes:
          type: [integer, "null"]
        awakeMinutes:
          type: [integer, "null"]
        awakeInBedMinutes:
          type: [integer, "null"]
        outOfBedMinutes:
          type: [integer, "null"]
        lightMinutes:
          type: [integer, "null"]
        deepMinutes:
          type: [integer, "null"]
        remMinutes:
          type: [integer, "null"]
        unknownMinutes:
          type: [integer, "null"]
        isNap:
          type: boolean
        recordingMethod:
          type: [string, "null"]
          enum: [AUTOMATICALLY_RECORDED, ACTIVELY_RECORDED, MANUAL_ENTRY, UNKNOWN, null]
        deviceModel:
          type: [string, "null"]
          maxLength: 120
        stages:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/SleepStage"
    HealthSampleImport:
      type: object
      additionalProperties: false
      required: [externalId, metric, startTime, endTime, value]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 300
        metric:
          $ref: "#/components/schemas/HealthMetricType"
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          description: Equal to startTime for instant measurements.
        value:
          type: number
        sourceApp:
          type: [string, "null"]
          maxLength: 120
        zoneOffset:
          type: [string, "null"]
          maxLength: 40
    HealthSampleRef:
      type: object
      additionalProperties: false
      required: [metric, externalId]
      properties:
        metric:
          $ref: "#/components/schemas/HealthMetricType"
        externalId:
          type: string
          minLength: 1
          maxLength: 300
    SleepSyncWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    SleepSyncPayload:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SleepSessionImport"
        deletedExternalIds:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 300
        window:
          $ref: "#/components/schemas/SleepSyncWindow"
    HealthSyncRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/DeviceHealthSource"
        deviceId:
          type: string
          minLength: 8
          maxLength: 128
        sleep:
          $ref: "#/components/schemas/SleepSyncPayload"
        samples:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/HealthSampleImport"
        deletedSamples:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/HealthSampleRef"
    HealthSyncCounts:
      type: object
      additionalProperties: false
      required: [imported, deleted]
      properties:
        imported:
          type: integer
        deleted:
          type: integer
    HealthSyncResponse:
      type: object
      additionalProperties: false
      required: [sleep, samples]
      properties:
        sleep:
          $ref: "#/components/schemas/HealthSyncCounts"
        samples:
          $ref: "#/components/schemas/HealthSyncCounts"
    HealthSyncState:
      type: object
      additionalProperties: false
      required: [source, metric, lastSyncedAt, lastEntryAt, backfilledFrom]
      properties:
        source:
          type: string
          enum: [HEALTH_CONNECT, APPLE_HEALTH, GOOGLE_HEALTH, MANUAL]
        metric:
          type: string
          description: SLEEP tracks the sleep-session domain.
          enum:
            - SLEEP
            - STEPS
            - DISTANCE_METERS
            - ACTIVE_ENERGY_KCAL
            - TOTAL_ENERGY_KCAL
            - EXERCISE_MINUTES
            - HEART_RATE_BPM
            - RESTING_HEART_RATE_BPM
            - HEART_RATE_VARIABILITY_MS
            - RESPIRATORY_RATE_BPM
            - BLOOD_OXYGEN_PERCENT
            - BODY_TEMPERATURE_C
            - WEIGHT_KG
            - BODY_FAT_PERCENT
            - VO2_MAX
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        lastEntryAt:
          type: [string, "null"]
          format: date-time
        backfilledFrom:
          type: [string, "null"]
          format: date-time
    HealthSyncStateListResponse:
      type: object
      additionalProperties: false
      required: [states]
      properties:
        states:
          type: array
          items:
            $ref: "#/components/schemas/HealthSyncState"
    ErrorDetail:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        issues: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
security:
  - mobileBearer: []
