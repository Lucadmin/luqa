          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    Category:
      type: object
      additionalProperties: false
      required: [id, name, color, archived]
      properties:
