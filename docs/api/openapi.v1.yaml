        archived:
          type: boolean
    SplitMode:
      type: string
      description: >-
        How the per-person shares were arrived at. Stored so reopening a bill
        shows the editor state it was saved with.
      enum: [EQUAL, PERCENT, AMOUNT]
    SettlementDirection:
      type: string
      description: Which way the money moved when a debt was paid off.
      enum: [TO_ME, FROM_ME]
    Person:
      type: object
      additionalProperties: false
      description: >-
        Someone in the owner's life. There is exactly one of these: the same
        person appears on a bill, in the People tab, and on a map, so identity
        is not money's. Everything below `archived` is profile, all of it
        optional — somebody who has only ever appeared on a restaurant bill is
        a complete person.


        The child collections ride inside the row rather than syncing on their
        own. One row is one whole profile, which is why any write to a child
        bumps the person's `updatedAt` and puts the whole row back in the
        delta feed.
      required:
        - id
        - name
        - color
        - emoji
        - defaultPercent
        - order
        - archived
        - nickname
        - photoUrl
        - birthdayYear
        - birthdayMonth
        - birthdayDay
        - cadenceDays
        - lastSeenAt
        - googleResourceName
        - places
        - channels
        - notes
        - gifts
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        emoji:
          type: [string, "null"]
        defaultPercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: >-
            The cut of a bill this person usually carries, in whole percent.
            Null means share equally with everyone else on it.
        order:
          type: integer
        archived:
          type: boolean
        nickname:
          type: [string, "null"]
          description: What the owner actually calls them.
        photoUrl:
          type: [string, "null"]
        birthdayYear:
          type: [integer, "null"]
          description: >-
            Null far more often than not. Most contacts carry a day and a month
            and no year, and inventing one produces a confidently wrong age, so
            a missing year is simply missing and no age is offered.
        birthdayMonth:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        birthdayDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: >-
            29 February is storable, because it is a real birthday. Which day it
            falls on in a common year is the client's next-occurrence rule.
        cadenceDays:
          type: [integer, "null"]
          description: >-
            How often being in touch is worth aiming for. Null for most people,
            and null means they are never reported as overdue.
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        googleResourceName:
          type: [string, "null"]
          description: >-
            The People API resource this row is linked to. Null for someone who
            exists only in Luqa.
        places:
          type: array
          items:
            $ref: "#/components/schemas/PersonPlace"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/PersonChannel"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PersonNote"
        gifts:
          type: array
          items:
            $ref: "#/components/schemas/PersonGiftIdea"
    PersonPlace:
      type: object
      additionalProperties: false
      description: >-
        Somewhere a person can be found. City-level on purpose: "I am in
        Hamburg on Thursday, who is here" is answered exactly as well by the
        city as by the street, and only the city centroid is ever geocoded — a
        record of friends' addresses should not become a map of their front
        doors.
      required:
        - id
        - label
        - city
        - region
        - country
        - address
        - cityId
        - timezone
        - latitude
        - longitude
        - isPrimary
        - source
      properties:
        id:
          type: string
        label:
          type: string
          description: What this place is to them — "Home", "Parents", "Summer".
        city:
          type: string
        region:
          type: [string, "null"]
          description: >-
            The first-level administrative area — state, province, Land. What
            tells two cities of the same name apart in a list.
        country:
          type: [string, "null"]
        address:
          type: [string, "null"]
          description: Kept for reference. Never the thing that gets plotted.
        cityId:
          type: [integer, "null"]
          description: >-
            The GeoNames id of the city that was chosen from the search list.
            Null for a name that was only typed — offline, or imported from a
            contact book — which is the place the geocoding batch is for. Two
            places sharing this id are the same city whatever their names look
            like, which is how two Cambridges stay two pins.
        timezone:
          type: [string, "null"]
          description: The IANA zone of that city, e.g. "Europe/Berlin".
        latitude:
          type: [number, "null"]
          description: >-
            City centroid. Present from the start for a chosen city; null for a
            typed one until the batch resolves it — a place that lists but does
            not yet pin.
        longitude:
          type: [number, "null"]
        isPrimary:
          type: boolean
        source:
          type: string
          enum: [GOOGLE, MANUAL]
    PersonChannel:
      type: object
      additionalProperties: false
      required: [id, kind, label, value, source]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [PHONE, EMAIL, HANDLE]
        label:
          type: [string, "null"]
        value:
          type: string
        source:
          type: string
          enum: [GOOGLE, MANUAL]
    PersonNote:
      type: object
      additionalProperties: false
      description: >-
        A dated list rather than one text field, because the useful thing is
        usually what was going on with them last time, and a single blob loses
        that the moment it is edited.
      required: [id, body, pinned, happenedOn, createdAt]
      properties:
        id:
          type: string
        body:
          type: string
        pinned:
          type: boolean
          description: >-
            Kept at the top: the allergy, the kids' names, the thing not to
            bring up.
        happenedOn:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        createdAt:
          type: string
          format: date-time
    PersonGiftIdea:
      type: object
      additionalProperties: false
      required: [id, idea, url, givenAt]
      properties:
        id:
          type: string
        idea:
          type: string
        url:
          type: [string, "null"]
        givenAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set once given. The row is kept rather than deleted, because the
            list's second job is not giving the same thing twice.
    PersonBalance:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - color
        - emoji
        - defaultPercent
        - order
        - archived
        - balanceCents
        - coveredCents
        - lastActivity
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        emoji:
          type: [string, "null"]
        defaultPercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        order:
          type: integer
        archived:
          type: boolean
        balanceCents:
          type: integer
          description: >-
            Positive means they owe the user, negative means the user owes
            them, zero means settled up.
        coveredCents:
          type: integer
          description: >-
            All-time total the user covered for them as a treat. Recorded, but
            never part of a balance.
        lastActivity:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    PersonGroup:
      type: object
      additionalProperties: false
      required: [id, name, color, emoji, order, archived, memberIds]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        emoji:
          type: [string, "null"]
        order:
          type: integer
        archived:
          type: boolean
        memberIds:
          type: array
          items:
            type: string
    ExpenseShare:
      type: object
      additionalProperties: false
      required: [personId, amountCents, percentBp, gifted]
      properties:
        personId:
          type: string
        amountCents:
          type: integer
        percentBp:
          type: [integer, "null"]
          description: This slice as basis points of the bill; 10000 is 100%.
        gifted:
          type: boolean
          description: >-
            Covered as a treat. Still totalled against the person, never a debt.
    Expense:
      type: object
      additionalProperties: false
      required:
        - id
        - description
        - amountCents
        - date
        - paidByPersonId
        - groupId
        - splitMode
        - myShareCents
        - notes
        - shares
        - createdAt
      properties:
        id:
          type: string
        description:
          type: string
        amountCents:
          type: integer
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        paidByPersonId:
          type: [string, "null"]
          description: >-
            Who fronted the money. Null means the user did. When someone else
            paid, only the user's own share moves a balance.
        groupId:
          type: [string, "null"]
        splitMode:
          $ref: "#/components/schemas/SplitMode"
        myShareCents:
          type: integer
          description: The user's own slice. Shares plus this equals the bill.
        notes:
          type: string
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseShare"
        createdAt:
          type: string
          format: date-time
    Settlement:
      type: object
      additionalProperties: false
      required: [id, personId, amountCents, direction, date, notes, createdAt]
      properties:
        id:
          type: string
        personId:
          type: string
        amountCents:
          type: integer
        direction:
          $ref: "#/components/schemas/SettlementDirection"
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    MoneyOverview:
      type: object
      additionalProperties: false
      required:
        - currency
        - people
        - groups
        - owedToYouCents
        - youOweCents
        - netCents
        - coveredCents
      properties:
        currency:
          type: string
        people:
          type: array
          description: >-
            Biggest outstanding balance first; settled people sink to the
            bottom. Archived people are included — they may still carry a
            balance, and their names have to resolve on old bills.
          items:
            $ref: "#/components/schemas/PersonBalance"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PersonGroup"
        owedToYouCents:
          type: integer
        youOweCents:
          type: integer
          description: Sum of the negative balances, as a positive number.
        netCents:
          type: integer
        coveredCents:
          type: integer
    LedgerItem:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - date
        - title
        - deltaCents
        - shareCents
        - gifted
        - amountCents
        - paidByPersonId
        - direction
        - expense
        - createdAt
      properties:
        kind:
          type: string
          enum: [expense, settlement]
        id:
          type: string
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        title:
          type: string
        deltaCents:
          type: integer
          description: >-
            Effect on the balance. Positive raises what they owe the user; a
            gift is zero.
        shareCents:
          type: integer
        gifted:
          type: boolean
        amountCents:
          type: [integer, "null"]
          description: The whole bill, for context. Null on paybacks.
        paidByPersonId:
          type: [string, "null"]
        direction:
          oneOf:
            - $ref: "#/components/schemas/SettlementDirection"
            - type: "null"
        expense:
          oneOf:
            - $ref: "#/components/schemas/Expense"
            - type: "null"
          description: Full editor state for bill rows. Null on paybacks.
        createdAt:
          type: string
          format: date-time
    PersonLedger:
      type: object
      additionalProperties: false
      required:
        - person
        - currency
        - balanceCents
        - coveredCents
        - coveredThisYearCents
        - items
      properties:
        person:
          $ref: "#/components/schemas/Person"
        currency:
          type: string
        balanceCents:
          type: integer
        coveredCents:
          type: integer
        coveredThisYearCents:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerItem"
    MoneyOverviewResponse:
      type: object
      additionalProperties: false
      required: [overview]
      properties:
        overview:
          $ref: "#/components/schemas/MoneyOverview"
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [expense]
      properties:
        expense:
          $ref: "#/components/schemas/Expense"
    ExpenseListResponse:
      type: object
      additionalProperties: false
      required: [expenses, nextCursor]
      properties:
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: [string, "null"]
    PersonResponse:
      type: object
      additionalProperties: false
      required: [person]
      properties:
        person:
          $ref: "#/components/schemas/Person"
    PersonListResponse:
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    DeletePersonResponse:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: >-
            True when the person was removed outright, false when they were
