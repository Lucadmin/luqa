  /habits:
    get:
      operationId: listHabits
      tags: [Habits]
      summary: Every habit on the account, archived included
      description: >-
        The delta feed is how a device normally stays current. This is the
        first read after a sign-in, and the recovery path for a cache that had
        to be thrown away: one page, no cursor, always complete.
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHabit
      tags: [Habits]
      summary: Create a habit
      responses:
        "200":
          description: >-
            A habit already exists under this id; it is returned rather than
            duplicated, so a retry after a lost response is harmless.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "201":
          description: Habit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHabitRequest"
  /habits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateHabit
      tags: [Habits]
      summary: Edit a habit's goal, schedule, icon, or archived state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHabitRequest"
      responses:
        "200":
          description: Habit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveHabit
      tags: [Habits]
      summary: Archive a habit
      description: >-
        Habits are archived rather than removed. The logs behind one are the
        record of a stretch of someone's life, and a streak that can be deleted
        by accident is worse than a list that needs tidying. Archiving one that
        is already archived succeeds.
      responses:
        "204":
          description: Habit archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /habits/reorder:
    post:
      operationId: reorderHabits
      tags: [Habits]
      summary: Persist a new ordering of habits
      description: >-
        The whole ordering rather than one habit's new position, so a replayed
        write restates the order instead of shuffling it again. Ids the account
        does not own are ignored rather than refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderHabitsRequest"
      responses:
        "200":
          description: The habits, in the order they are now stored in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /habits/{id}/logs/{date}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        required: true
        description: The logical day, as a YYYY-MM-DD key in the user's timezone.
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    put:
      operationId: putHabitLog
      tags: [Habits]
      summary: Record a day's progress
      description: >-
        A PUT of state rather than a POST of an action. The browser posts
        "increment" and lets the server add one; a queued write cannot, because
        a retry after a lost response would add one twice. A device resolves
        habits locally, so it already knows what the day looks like and sends
        the numbers — replaying the write lands on the same numbers.


        Completion is recomputed from the habit's goal rather than taken from
        the request, so the two clients cannot disagree about what a streak is
        made of. The moment a day was first completed is kept once it is known.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutHabitLogRequest"
      responses:
        "200":
          description: Progress recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitLogResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sync:
    get:
      operationId: syncChanges
      tags: [Sync]
      summary: Everything that changed since the cursors the caller holds
      description: >-
        The delta feed. A device keeps one cursor per collection and asks for
        what changed since; omitting a cursor asks for that collection from the
        beginning, which is what a fresh install does.


        Cursors are opaque and per collection, passed as `cursor.<name>`. A
        collection that reaches `limit` answers `hasMore: true` and is asked
        again with the cursor it returned. A cursor that cannot be read is
        treated as absent — the collection resyncs from the start, which is
        slow but always correct.


        Rows and deletions are reported separately: `rows` carries the current
        state of anything created or changed, `deleted` carries the ids of rows
        that went away so a device can drop its copies.
      parameters:
        - name: collections
          in: query
          required: false
          description: >-
            Comma-separated subset to sync. Defaults to all of them. Unknown
            names are ignored.
          schema:
            type: string
            example: people,expenses
        - name: limit
          in: query
          required: false
          description: Maximum rows per collection per request.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor.categories
          in: query
          required: false
          schema: { type: string }
        - name: cursor.people
          in: query
          required: false
          schema: { type: string }
        - name: cursor.groups
          in: query
          required: false
          schema: { type: string }
        - name: cursor.gymLocations
          in: query
          required: false
          schema: { type: string }
        - name: cursor.exercises
          in: query
          required: false
          schema: { type: string }
        - name: cursor.habits
          in: query
          required: false
          schema: { type: string }
        - name: cursor.timeEntries
          in: query
          required: false
          schema: { type: string }
        - name: cursor.sleepEntries
          in: query
          required: false
          schema: { type: string }
        - name: cursor.expenses
          in: query
          required: false
          schema: { type: string }
        - name: cursor.settlements
          in: query
          required: false
          schema: { type: string }
        - name: cursor.gymSessions
          in: query
          required: false
          schema: { type: string }
        - name: cursor.habitLogs
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Changes per collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived Luqa mobile access token.
  responses:
    InvalidInput:
      description: Malformed JSON, input, or query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, revoked, or missing device credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist, or is not owned by this user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdConflict:
      description: The client-supplied id already belongs to another account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many credential attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        deviceId:
          type: string
          minLength: 8
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 256
    MobileUser:
