    SyncCollections:
      type: object
      description: >-
        Every collection the caller asked for. A collection that was not asked
        for is absent rather than empty, so a narrowed sync cannot be mistaken
        for one that found nothing.
      properties:
        categories:
          $ref: "#/components/schemas/CategoryDelta"
        people:
          $ref: "#/components/schemas/PersonDelta"
        groups:
          $ref: "#/components/schemas/PersonGroupDelta"
        gymLocations:
          $ref: "#/components/schemas/GymLocationDelta"
        exercises:
          $ref: "#/components/schemas/GymExerciseDelta"
        habits:
          $ref: "#/components/schemas/HabitDelta"
        timeEntries:
          $ref: "#/components/schemas/TimeEntryDelta"
        sleepEntries:
          $ref: "#/components/schemas/SleepEntryDelta"
        expenses:
          $ref: "#/components/schemas/ExpenseDelta"
        settlements:
          $ref: "#/components/schemas/SettlementDelta"
        gymSessions:
          $ref: "#/components/schemas/GymSessionDelta"
        habitLogs:
          $ref: "#/components/schemas/HabitLogDelta"
    SyncExercise:
      type: object
      additionalProperties: false
      description: >-
        An exercise as the delta feed sends it — the stored row only. The
        counts and last-performed dates the overview shows are derived from
        the sessions, so a device computes them rather than being told.
      required: [id, name, notes, archived]
      properties:
        id:
          type: string
        name:
          type: string
        notes:
          type: string
        archived:
          type: boolean
    SyncSettings:
      type: object
      description: >-
        Account-level values no collection carries, but a screen rendered
        entirely from the device still needs.
      required: [currency, dayStartHour, weekStartsOn]
      properties:
        currency:
          type: string
          description: ISO 4217 code the amounts are in.
        dayStartHour:
          type: integer
          minimum: 0
          maximum: 23
          description: >-
            The hour a logical day flips. Someone who logs a block at 01:00
            means it for the day that has not ended yet, so the day a row
            belongs to is not the day its clock says.
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
          description: >-
            0 = Sunday, 1 = Monday. Habit weeks are counted from here, so a
            device that guessed would put a "3x per week" quota in the wrong
            week for half the world.
    SyncResponse:
      type: object
      required: [settings, collections]
      properties:
        settings:
          $ref: "#/components/schemas/SyncSettings"
        collections:
          $ref: "#/components/schemas/SyncCollections"
