  /people/places/search:
    get:
      operationId: searchCities
      tags: [People]
      summary: The cities a name might mean
      description: >-
        So that the owner decides which Springfield, rather than a geocoder
        deciding for them. Each candidate carries its administrative area, its
        country and its population — the fields that make two rows both reading
        "Springfield" tellable apart — and a stable id, which is what the place
        then stores.


        Answering also fills the server's city cache, which is what lets the
        subsequent `POST /people/{id}/places` resolve that id without touching
        a third party.


        Safe to call per keystroke behind a short debounce: repeated queries
        are answered from the cache.
      parameters:
        - name: q
          in: query
          required: true
          description: What has been typed so far. Under two characters answers with nothing.
          schema:
            type: string
            maxLength: 120
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Matching cities, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /people/places/geocode:
    post:
      operationId: geocodePendingPlaces
      tags: [People]
      summary: Put points on the cities that have none yet
      description: >-
        Pull rather than push. Adding a city answers instantly and the pin
        catches up: geocoding on the write path would make typing a city name
        wait on a rate-limited third party, and a serverless request cannot
        promise to finish background work after replying.


        Only the city is ever sent to the geocoder, and only its centroid is
        stored. The map answers "who is in this city", which a centroid answers
        exactly as well as a street address would — without turning a record of
        friends' addresses into a map of their front doors.


        Call it when opening the map, and again while `remaining` is above zero.
      responses:
        "200":
          description: How many cities were resolved, and how many are still waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
