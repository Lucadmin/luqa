openapi: 3.1.0
info:
  title: Luqa Mobile API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Stable native-client contract for Luqa. Authentication uses revocable
    opaque bearer tokens; the browser companion retains its Auth.js session.
servers:
  - url: /api/v1
tags:
  - name: Authentication
    description: Native device-session creation, rotation, and revocation.
  - name: Categories
    description: User-owned activity categories and identity colors.
  - name: Time entries
    description: Retrospective blocks and running activity timers.
  - name: Sleep
    description: Read-only sleep sessions already ingested through health sync.
  - name: Health
    description: >-
      On-device health ingestion. The client reads the platform store (Android
      Health Connect, iOS HealthKit later) and pushes normalized records; the
      server never pulls from a provider.
  - name: Gym
    description: Location-aware workout logging, exercise history, and gyms.
  - name: Sync
    description: >-
      Incremental replication. One cursor per collection, so a device that has
      been offline fetches only what changed rather than everything it already
      has.
  - name: Money
    description: >-
      Shared expenses: who owes whom, the bills behind it, and the paybacks
      that settle it. Every amount is integer cents so no split ever loses one,
      and every balance is written from the user's point of view — positive
      means this person owes the user.
  - name: Habits
    description: >-
      What the user is trying to keep up, and how it is going. A habit is a
      goal (a task, a count, or a duration) plus a schedule, and a log is one
      day's progress against it. A device resolves which habits a day holds,
      and whether each is done, from the rows it already has — so the strip on
      Today is correct with no network at all.
  - name: People
    description: >-
      The person behind the balance: birthdays, notes, gift ideas, the cities
      they can be found in, and how often being in touch is worth aiming for.
      One `Person` serves both this and Money — the same friend on a bill and
      on a map is one row, not two — and the profile children ride inside it
      rather than syncing on their own.
paths:
  /auth/session:
    post:
      operationId: createMobileSession
      tags: [Authentication]
      summary: Exchange owner credentials for a device session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Device session created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: revokeMobileSession
      tags: [Authentication]
      summary: Revoke the current device session
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      operationId: refreshMobileSession
      tags: [Authentication]
      summary: Rotate a refresh token and issue a new credential pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredentials"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      summary: List the current user's categories
      responses:
        "200":
          description: Category collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create or resolve a category by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "200":
          description: An existing case-insensitive name match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [Time entries]
      summary: List entries overlapping a half-open UTC window
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Time-entry collection ordered by start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTimeEntry
      tags: [Time entries]
      summary: Create a completed block or running timer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntryRequest"
      responses:
        "200":
          description: >-
            The `id` was already used by an earlier create from this account;
            the existing entry is returned untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryResponse"
        "201":
          description: Time entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdConflict"
  /time-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTimeEntry
      tags: [Time entries]
      summary: Edit an entry, or stop a running timer by giving it an end
      description: >-
        Every field is optional; omitted fields are left untouched. Sending
        `endTime: null` reopens the entry as a running timer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeEntryRequest"
      responses:
        "200":
          description: Time entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTimeEntry
      tags: [Time entries]
      summary: Soft-delete an entry
      responses:
        "204":
          description: Time entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sleep-entries:
    get:
      operationId: listSleepEntries
      tags: [Sleep]
      summary: List sleep sessions that ended inside a half-open UTC window
      description: >-
        Sessions are attributed to the day they woke up in, which is how the
        timeline places them. Writes go through `/health/sync`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sleep-session collection ordered by wake time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepEntryListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health/sync:
    get:
      operationId: getHealthSyncState
      tags: [Health]
      summary: Read what the server last accepted, per source and metric
      responses:
        "200":
          description: Sync watermarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSyncStateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: pushHealthSync
      tags: [Health]
      summary: Push sleep sessions and samples read from the device
      description: >-
        Idempotent by provider record id. Supply `sleep.window` only when the
        device re-read a full range: it authorizes the server to soft-delete
        sessions inside that range it no longer sees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthSyncRequest"
      responses:
        "200":
          description: Counts applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSyncResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gym:
    get:
      operationId: getGymOverview
      tags: [Gym]
      summary: Load gyms, exercises, per-gym references, and recent workouts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Gym overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gym/sessions:
    get:
      operationId: listGymSessions
      tags: [Gym]
      summary: List workouts newest first
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Workout page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGymSession
      tags: [Gym]
      summary: Start an autosaved workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGymSessionRequest"
      responses:
        "200":
          description: >-
            The `id` was already used by an earlier create from this account;
            the existing workout is returned untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSessionResponse"
        "201":
          description: Workout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdConflict"
  /gym/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGymSession
      tags: [Gym]
      summary: Load one workout
      responses:
        "200":
          description: Workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGymSession
      tags: [Gym]
      summary: Autosave a workout draft
      description: >-
        Omitted fields stay unchanged. Sending exercises replaces the ordered
        exercise list; empty sets are ignored server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGymSessionRequest"
      responses:
        "200":
          description: Saved workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSessionResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGymSession
      tags: [Gym]
      summary: Delete a workout
      description: >-
        Soft-deletes the workout and everything logged in it, including one
        that was only just started. The exercise library is untouched.
      responses:
        "204":
          description: Workout deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gym/exercises/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateGymExercise
      tags: [Gym]
      summary: Rename, annotate, archive, or restore an exercise
      description: >-
        Renaming onto a name another exercise already uses merges the two
        rather than failing, which is the fix for years of spelling drift.
        `mergedInto` names the surviving exercise when that happened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGymExerciseRequest"
      responses:
        "200":
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymExerciseUpdateResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGymExercise
      tags: [Gym]
      summary: Remove an exercise from the library
      description: >-
        An exercise nothing has been logged against is deleted. One with
        history is archived instead, so the workouts that used it keep reading
        the way they were written. `deleted` says which happened.
      responses:
        "200":
          description: Removed or archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGymExerciseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gym/exercises/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        description: Exercise whose history will be moved and then removed.
        schema:
          type: string
    post:
      operationId: mergeGymExercise
      tags: [Gym]
      summary: Merge a duplicate exercise into another exercise
      description: >-
        Moves every logged performance to the target exercise, keeps the
        target name, and removes the source exercise from the library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeGymExerciseRequest"
      responses:
        "200":
          description: Exercises merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymExerciseMergeResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gym/exercises/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGymExerciseHistory
      tags: [Gym]
      summary: Load one exercise's progress history
      parameters:
        - name: locationId
          in: query
          required: false
          description: Keep machine stacks from different gyms separate.
          schema:
            type: string
        - name: beforeSessionId
          in: query
          required: false
          description: Return only performances before this workout.
          schema:
            type: string
      responses:
        "200":
          description: Exercise history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymExerciseHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gym/locations:
    post:
      operationId: createGymLocation
      tags: [Gym]
      summary: Add a gym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGymLocationRequest"
      responses:
        "200":
          description: >-
            A gym with this code already exists; it is returned rather than
            duplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymLocationResponse"
        "201":
          description: Gym created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymLocationResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gym/locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateGymLocation
      tags: [Gym]
      summary: Edit, archive, or restore a gym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGymLocationRequest"
      responses:
        "200":
          description: Gym updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymLocationResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /money:
    get:
      operationId: getMoneyOverview
      tags: [Money]
      summary: Load every balance, the groups, and the headline totals
      responses:
        "200":
          description: Money overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /money/expenses:
    get:
      operationId: listExpenses
      tags: [Money]
      summary: List bills newest first
      parameters:
        - name: personId
          in: query
          required: false
          description: Only bills this person is on, or fronted.
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Bill page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExpense
      tags: [Money]
      summary: Log a bill and who carries what
      description: >-
        The split is recomputed server-side from `splitMode`, `includeMe` and
        `participants`, so the stored shares can never disagree with the rules
        the editor previewed. Shares plus the user's own slice always add up to
        the bill exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "200":
          description: >-
            The `id` was already used by an earlier create from this account;
            the existing bill is returned untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdConflict"
  /money/expenses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateExpense
      tags: [Money]
      summary: Edit a bill
      description: >-
        Omitted fields stay unchanged. Anything that can move the numbers
        re-runs the split; fields left out of a re-split fall back to how the
        bill already looks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "200":
          description: Saved bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteExpense
      tags: [Money]
      summary: Drop a bill and every share on it
      responses:
        "204":
          description: >-
            Gone. Also the answer for a bill that was already deleted, so a
            queued delete replayed from a device cannot fail on its second try.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /people:
    get:
      operationId: listPeopleProfiles
      tags: [People]
      summary: Everyone, archived included, each with their whole profile
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPersonProfile
      tags: [People]
      summary: Add someone, identity and profile in one write
      description: >-
        One write rather than a create plus a patch, because the editor asks
        for a name, a birthday and a rhythm on the same sheet — and two queue
        entries for one action leaves the second one strandable on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "200":
          description: >-
            Someone with this name — or this id — already exists on the
            account; they are returned rather than duplicated, so the same
            person added offline on two devices converges on one row. The
            profile already on that row is left untouched, because a create
            replayed from a queue must not blank out notes written since.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdConflict"
  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPersonProfile
      tags: [People]
      summary: One person, whole profile
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePersonProfile
      tags: [People]
      summary: Rename, restyle, or change the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePersonProfile
      tags: [People]
      summary: Remove someone, as far as it is safe to
      description: >-
        Anyone who has been on a bill is archived rather than deleted: their
        shares are what produced everyone else's balances, and a name that
        stops resolving turns old bills into arithmetic nobody can check.
        `deleted` says which happened, so the client knows whether to expect
        the row back.
      responses:
        "200":
          description: Removed or archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePersonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /people/{id}/seen:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: markPersonSeen
      tags: [People]
      summary: Record that they were actually seen
      description: >-
        Its own endpoint rather than a PATCH field, because it carries a rule a
        general update does not: a "saw them on Tuesday" replayed from a
        queue on Friday must not drag the date back past a sighting already
        recorded since.
      requestBody:
        required: false
