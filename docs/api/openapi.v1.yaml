    PersonLedgerResponse:
      type: object
      additionalProperties: false
      required: [ledger]
      properties:
        ledger:
          $ref: "#/components/schemas/PersonLedger"
    GroupResponse:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          $ref: "#/components/schemas/PersonGroup"
    GroupListResponse:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PersonGroup"
    SettlementResponse:
      type: object
      additionalProperties: false
      required: [settlement]
      properties:
        settlement:
          $ref: "#/components/schemas/Settlement"
    SettlementListResponse:
      type: object
      additionalProperties: false
      required: [settlements]
      properties:
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
    ExpenseParticipantInput:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId:
          type: string
        percentBp:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000
          description: "PERCENT mode: this person's cut, in basis points."
        amountCents:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: "AMOUNT mode: the exact cents this person carries."
        gifted:
          type: boolean
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [amountCents]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Client-minted identity for the bill, so one split at the table with no signal can still be edited and referred to. Supplying it makes the create idempotent.
        description:
          type: string
          maxLength: 200
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        paidByPersonId:
          type: [string, "null"]
        groupId:
          type: [string, "null"]
        splitMode:
          $ref: "#/components/schemas/SplitMode"
        includeMe:
          type: boolean
          description: "EQUAL mode: whether the user is one of the equal parts."
        participants:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ExpenseParticipantInput"
        notes:
          type: string
          maxLength: 2000
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 200
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        paidByPersonId:
          type: [string, "null"]
        groupId:
          type: [string, "null"]
        splitMode:
          $ref: "#/components/schemas/SplitMode"
        includeMe:
          type: boolean
        participants:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ExpenseParticipantInput"
        notes:
          type: string
          maxLength: 2000
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Preferred identity for someone added offline. Honoured only when free; an existing person with the same name wins, so the response is authoritative.
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        emoji:
          type: [string, "null"]
          maxLength: 8
        defaultPercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        nickname:
          type: [string, "null"]
          maxLength: 60
        photoUrl:
          type: [string, "null"]
          format: uri
          maxLength: 500
        birthdayYear:
          type: [integer, "null"]
          minimum: 1900
          maximum: 2200
        birthdayMonth:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        birthdayDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        cadenceDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
        lastSeenAt:
          type: [string, "null"]
          format: date-time
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        emoji:
          type: [string, "null"]
          maxLength: 8
        defaultPercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        order:
          type: integer
          minimum: 0
        archived:
          type: boolean
        nickname:
          type: [string, "null"]
          maxLength: 60
        photoUrl:
          type: [string, "null"]
          format: uri
          maxLength: 500
        birthdayYear:
          type: [integer, "null"]
          minimum: 1900
          maximum: 2200
        birthdayMonth:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        birthdayDay:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        cadenceDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
        lastSeenAt:
          type: [string, "null"]
          format: date-time
    CreatePersonNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Preferred identity, so a note written offline and retried after a
            lost response lands once rather than twice.
        body:
          type: string
          minLength: 1
          maxLength: 4000
        pinned:
          type: boolean
        happenedOn:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    UpdatePersonNoteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        pinned:
          type: boolean
        happenedOn:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    CreatePersonGiftRequest:
      type: object
      additionalProperties: false
      required: [idea]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        idea:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: [string, "null"]
          format: uri
          maxLength: 500
    UpdatePersonGiftRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        idea:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: [string, "null"]
          format: uri
          maxLength: 500
        givenAt:
          type: [string, "null"]
          format: date-time
          description: >-
            A date marks it given; null puts it back on the list. Either way
            the row stays.
    CreatePersonPlaceRequest:
      type: object
      additionalProperties: false
      required: [label, city]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        label:
          type: string
          minLength: 1
          maxLength: 60
        city:
          type: string
          minLength: 1
          maxLength: 120
        region:
          type: [string, "null"]
          maxLength: 120
        country:
          type: [string, "null"]
          maxLength: 120
        address:
          type: [string, "null"]
          maxLength: 300
        cityId:
          type: [integer, "null"]
          minimum: 1
          description: >-
            The city the owner picked, as a GeoNames id from
            `GET /people/places/search`. Sending it is what makes the place pin
            on write: the server resolves the point from the cache that search
            filled, so no third party is on this path. Leave it out for a city
            that was only typed — offline, say — and the place lands unlocated
            for the geocoding batch to guess at.


            Note what this request cannot carry: coordinates. The client says
            which city, never where it is.
        isPrimary:
          type: boolean
          description: >-
            The first place is primary whether or not this is set: a person
            with exactly one city and no primary has no answer to "where are
            they".
    CityCandidate:
      type: object
      additionalProperties: false
      description: >-
        A settlement the geocoder knows about, with enough context to choose
        between two of the same name.
      required:
        - id
        - name
        - admin1
        - country
        - countryCode
        - latitude
        - longitude
        - timezone
        - population
        - featureCode
      properties:
        id:
          type: integer
          description: >-
            The GeoNames id. Stable, and the only thing the client sends back
            when this candidate is chosen.
        name:
          type: string
        admin1:
          type: [string, "null"]
          description: >-
            State, province or Land. The single most useful field for telling
            Springfield, Illinois from Springfield, Missouri.
        country:
          type: [string, "null"]
        countryCode:
          type: [string, "null"]
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: [string, "null"]
        population:
          type: [integer, "null"]
          description: >-
            Shown beside each candidate, because size is how a person actually
            recognises which city was meant.
        featureCode:
          type: [string, "null"]
          description: >-
            GeoNames' kind: PPLC for a national capital, PPLA for a regional
            one, PPL for an ordinary settlement.
    CitySearchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          description: >-
            Best match first, in the geocoder's own ranking. Empty when the
            query is too short, matches nothing, or could not be asked — all
            three leave the client offering the typed name as it stands.
          items:
            $ref: "#/components/schemas/CityCandidate"
    GeocodeResponse:
      type: object
      additionalProperties: false
      required: [resolved, remaining]
      properties:
        resolved:
          type: integer
          description: Places given a point by this call.
        remaining:
          type: integer
          description: >-
            Places still without one. Above zero means the map is worth asking
            again; each call is bounded so that a long-neglected address book
            cannot make one request run past a serverless timeout.
    MarkSeenRequest:
      type: object
      additionalProperties: false
      properties:
        seenAt:
          type: [string, "null"]
