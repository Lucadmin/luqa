    HabitGoalType:
      type: string
      description: >-
        What "done" means for one day. TASK is done or not; COUNT reaches a
        number of reps; TIME accumulates a duration.
      enum: [TASK, COUNT, TIME]
    HabitGoalPeriod:
      type: string
      description: >-
        Whether a TIME target is a daily quota or a running total for the week
        or month.
      enum: [DAY, WEEK, MONTH]
    HabitScheduleType:
      type: string
      description: >-
        How a habit recurs. The TIMES_PER_* forms are active every day and
        track a quota across the period instead of naming particular days.
      enum:
        - DAILY
        - WEEKDAYS
        - INTERVAL
        - TIMES_PER_WEEK
        - TIMES_PER_MONTH
        - TIMES_PER_YEAR
        - DATES
    Habit:
      type: object
      additionalProperties: false
      description: >-
        A goal plus a schedule. Together they decide what shows on a given day
        and what counts as done on it.
      required:
        - id
        - name
        - icon
        - color
        - order
        - goalType
        - goalPeriod
        - targetCount
        - targetSeconds
        - categoryId
        - scheduleType
        - weekdays
        - weekInterval
        - intervalDays
        - intervalFromLastDone
        - timesPerPeriod
        - anchorDate
        - dates
        - excludedDates
        - archived
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: [string, "null"]
          description: Name from the shared habit icon set.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        order:
          type: integer
        goalType:
          $ref: "#/components/schemas/HabitGoalType"
        goalPeriod:
          $ref: "#/components/schemas/HabitGoalPeriod"
        targetCount:
          type: integer
          description: Reps needed for a COUNT goal. Always 1 for TASK.
        targetSeconds:
          type: integer
          description: Duration goal in seconds for a TIME habit.
        categoryId:
          type: [string, "null"]
          description: >-
            A TIME habit linked to a tracking category draws its progress from
            the time tracked on that category, and its timer is a real time
            entry rather than a number kept beside one.
        scheduleType:
          $ref: "#/components/schemas/HabitScheduleType"
        weekdays:
          type: array
          description: For WEEKDAYS — 0 is Sunday, 6 is Saturday.
          items:
            type: integer
            minimum: 0
            maximum: 6
        weekInterval:
          type: integer
          description: For WEEKDAYS — every N weeks.
        intervalDays:
          type: integer
          description: For INTERVAL — every N days from the anchor.
        intervalFromLastDone:
          type: boolean
          description: >-
            For INTERVAL — count from the last day the goal was met rather than
            from the anchor. "Shave every second day" on a fixed grid keeps
            insisting on the original odd days; counting from the last
            completion shifts the whole cycle, which is what that phrase
            usually means. An overdue rolling habit stays due every day until
            it is done.
        timesPerPeriod:
          type: integer
          description: For TIMES_PER_* — the quota within each period.
        anchorDate:
          type: [string, "null"]
          description: >-
            YYYY-MM-DD the interval counts from. Null falls back to the day the
            habit was created.
        dates:
          type: array
          description: For DATES — the explicit YYYY-MM-DD days.
          items:
            type: string
        excludedDates:
          type: array
          description: Days to skip, whatever the schedule would otherwise say.
          items:
            type: string
        archived:
          type: boolean
          description: >-
            Archived habits stay in the feed so a device is told one it is
            showing has been put away.
        createdAt:
          type: string
          format: date-time
    HabitLog:
      type: object
      additionalProperties: false
      description: One habit's stored progress for one logical day.
      required: [id, habitId, date, count, seconds, runningSince, completedAt]
      properties:
        id:
          type: string
        habitId:
          type: string
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        count:
          type: integer
          description: Reps done for a COUNT goal, or 0/1 for a TASK.
        seconds:
          type: integer
          description: Seconds banked toward an unlinked TIME goal.
        runningSince:
          type: [string, "null"]
          format: date-time
          description: >-
            When an unlinked timer started. The elapsed time is added as it
            runs rather than written every second, so a device that is asleep
            still shows the right total when it wakes.
        completedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            The first moment the day's goal was met. A seventh glass of water
            does not re-complete the day.
