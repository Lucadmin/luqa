          type: string
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        archived:
          type: boolean
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Preferred identity for a category minted offline. Honoured only
            when free; the response is authoritative, since a category with
            the same name may already exist under a different id.
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    CategoryResponse:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    EntrySource:
      type: string
      enum: [APP, GOOGLE]
    TimeEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - description
        - categoryId
        - startTime
        - endTime
        - source
        - personIds
      properties:
        id:
          type: string
        description:
          type: string
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        source:
          $ref: "#/components/schemas/EntrySource"
        personIds:
          type: array
          items:
            type: string
          description: >-
            Who was there. Rides inside the entry rather than syncing on its
            own, the same way a person's notes ride inside them: one row is one
            whole block of time. This is what lets "last seen" be a fact the
            app already knows rather than one the owner types twice.
    CreateTimeEntryRequest:
      type: object
      additionalProperties: false
      required: [startTime]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Client-minted identity for the row, so a device can name a block
            before the server has seen it. Supplying it makes the create
            idempotent: repeating the request returns the row it already made.
        description:
          type: string
          maxLength: 500
          default: ""
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        personIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: >-
            Who was there. Ids that are not this account's are dropped rather
            than rejected: a phone replaying a queued write may name somebody
            deleted since, and refusing the whole entry over a tag would lose a
            block of time to protect it.
    TimeEntryResponse:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/TimeEntry"
    TimeEntryListResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimeEntry"
    UpdateTimeEntryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 500
        categoryId:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        personIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: >-
            Who was there. Absent leaves the tags alone; an empty array clears
            them. Ids that are not this account's are dropped rather than
            rejected: a phone replaying a queued write may name somebody
            deleted since, and refusing the whole entry over a tag would lose a
            block of time to protect it.
    SleepSource:
      type: string
      enum: [HEALTH_CONNECT, APPLE_HEALTH, GOOGLE_HEALTH, MANUAL]
    SleepEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - title
        - sourceApp
        - startTime
        - endTime
        - sleepMinutes
        - awakeMinutes
        - awakeInBedMinutes
        - outOfBedMinutes
        - lightMinutes
        - deepMinutes
        - remMinutes
        - unknownMinutes
        - inBedMinutes
        - efficiencyPercent
        - latencyMinutes
        - wasoMinutes
        - awakeningCount
        - midpoint
        - isNap
        - recordingMethod
        - deviceModel
        - stages
      properties:
        id:
          type: string
        source:
          $ref: "#/components/schemas/SleepSource"
        title:
          type: [string, "null"]
        sourceApp:
          type: [string, "null"]
          description: Provider application that recorded the session, when known.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        sleepMinutes:
          type: [integer, "null"]
          description: Asleep minutes. Null when the provider only reported time in bed.
        awakeMinutes:
          type: [integer, "null"]
        awakeInBedMinutes:
          type: [integer, "null"]
        outOfBedMinutes:
          type: [integer, "null"]
        lightMinutes:
          type: [integer, "null"]
        deepMinutes:
          type: [integer, "null"]
        remMinutes:
          type: [integer, "null"]
        unknownMinutes:
          type: [integer, "null"]
          description: Staged time the provider could not classify.
        inBedMinutes:
          type: [integer, "null"]
          description: Wall-clock session length.
        efficiencyPercent:
          type: [number, "null"]
          description: Asleep over time in bed, 0-100.
        latencyMinutes:
          type: [integer, "null"]
          description: Session start until the first asleep stage.
        wasoMinutes:
          type: [integer, "null"]
          description: Wake after sleep onset, before the final wake.
        awakeningCount:
          type: [integer, "null"]
          description: Distinct awake blocks after sleep onset.
        midpoint:
          type: [string, "null"]
          format: date-time
          description: Midpoint of the asleep span, for chronotype drift.
        isNap:
          type: boolean
        recordingMethod:
          type: [string, "null"]
        deviceModel:
          type: [string, "null"]
        stages:
          type: array
          description: >-
            The night's stage timeline, normalized server-side. Empty when the
            provider reported totals only.
          items:
            $ref: "#/components/schemas/SleepStage"
    SleepEntryListResponse:
      type: object
